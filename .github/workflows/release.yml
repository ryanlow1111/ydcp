name: Release

# Pushing a tag vX.Y.Z builds macOS and Windows together into ONE draft release.
# If any platform fails, the draft is left unpublished. A maintainer tests the draft,
# then presses Publish once, so both platforms go live at the same time.

# "Run workflow" (workflow_dispatch) is a test build: it builds every platform from a branch,
# with no tag and no release, to prove the builds work before tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.

jobs:
  draft:
    name: Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches every version field
        run: node scripts/check-version.mjs
      - id: create
        name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          WINDOWS_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          VERSION="${TAG#v}"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          # The API answers with the new release's id; a brand-new draft may not be listed yet.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="YDCP $TAG" -F body=@notes.md \
            -F draft=true -F prerelease="$PRERELEASE" --jq .id)
          test -n "$ID"
          echo "release-id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The agent-link hook scripts, so people who installed the app (and never cloned the repo)
      # can download them from the release, with a checksum like the installers have.
      - name: Attach the agent-link hook scripts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release-id }}
        run: |
          cd integrations/claude-code-hooks
          sha256sum ydcp-state.sh ydcp-state.ps1 > SHA256SUMS-hooks.txt
          for FILE in ydcp-state.sh ydcp-state.ps1 SHA256SUMS-hooks.txt; do
            curl -sSf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary "@$FILE" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE" > /dev/null
          done

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    # Runs after the draft, or by itself in a test build (where the draft job is skipped).
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # SignPath reads this job's details and downloads its artifacts
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      # Windows is signed through SignPath Foundation once the SIGNPATH_* settings exist
      # (CONTRIBUTING.md → Windows code signing). Until then, and always on macOS, the build is
      # unsigned, exactly as before.
      SIGN_WITH_SIGNPATH: ${{ startsWith(matrix.os, 'windows') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      # Every platform finishes, so one run shows every problem. Nothing is published either
      # way: the release stays a draft until a maintainer publishes it.
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # MSI (WiX) can't target ARM64, so Windows on ARM gets the NSIS setup.exe only.
          - name: windows-arm64
            os: windows-latest
            targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - run: npm ci

      # macOS signing + notarization is optional. Only pass the secrets on when a certificate is
      # really set: an empty APPLE_CERTIFICATE makes Tauri try to import it, and the build fails.
      # Without them the app is ad-hoc signed (bundle.macOS.signingIdentity "-").
      - name: Use Apple signing secrets, if set
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
          fi

      # Unsigned (macOS always; Windows until SignPath is set up): build, package and attach.
      - id: tauri
        if: env.SIGN_WITH_SIGNPATH != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Signed Windows, in two rounds so the app inside the installer is signed too:
      #   1. build ydcp.exe → SignPath signs it
      #   2. package the signed exe into the installers → SignPath signs the installers
      # --no-binary-patching keeps the exe exactly as signed (the patch only helps the updater
      # plugin, which YDCP doesn't use). Every release needs an approver to approve both rounds
      # for each Windows build in SignPath; the job waits up to 2 hours per round.
      - name: Build the app (not packaged yet)
        if: env.SIGN_WITH_SIGNPATH == 'true'
        shell: bash
        run: npx tauri build --target "$TARGET" --no-bundle

      - id: upload-app
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/ydcp.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the app (SignPath)
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ydcp' }}
          # A test build ("Run workflow") uses SignPath's test certificate, which needs no approval.
          signing-policy-slug: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-app

      - name: Package the signed app into installers
        if: env.SIGN_WITH_SIGNPATH == 'true'
        shell: bash
        run: |
          cp signed-app/ydcp.exe "src-tauri/target/$TARGET/release/ydcp.exe"
          npx tauri bundle --target "$TARGET" --bundles "$BUNDLES" --no-binary-patching
          mkdir unsigned-installers
          find "src-tauri/target/$TARGET/release/bundle" \( -name '*-setup.exe' -o -name '*.msi' \) -type f \
            -exec cp {} unsigned-installers/ \;
          ls unsigned-installers

      - id: upload-installers
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installers-${{ matrix.name }}
          path: unsigned-installers/
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installers (SignPath)
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ydcp' }}
          signing-policy-slug: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installers

      # Replaces the unsigned installers in the bundle folder (so the provenance step below
      # covers the signed files) and attaches them to the draft.
      - id: signed
        name: Attach the signed installers
        if: env.SIGN_WITH_SIGNPATH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          EVENT: ${{ github.event_name }}
        run: |
          PATHS=()
          for FILE in signed-installers/*; do
            NAME=$(basename "$FILE")
            DEST=$(find "src-tauri/target/$TARGET/release/bundle" -name "$NAME" -type f | head -n 1)
            test -n "$DEST"
            cp "$FILE" "$DEST"
            PATHS+=("$DEST")
            if [ "$EVENT" = push ]; then
              curl -sSf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$DEST" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" > /dev/null
            fi
          done
          echo "artifact-paths=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${PATHS[@]}")" >> "$GITHUB_OUTPUT"

      - name: Checksums
        if: github.event_name == 'push'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths || steps.signed.outputs.artifact-paths }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          FILE="SHA256SUMS-${{ matrix.name }}.txt"
          node scripts/checksums.mjs "$FILE"
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary "@$FILE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$FILE" > /dev/null

      # Signed proof of which workflow built which file. GitHub offers this for public repos
      # (private repos need GitHub Enterprise), so it runs once the repo is public.
      - name: Build provenance
        if: ${{ github.event_name == 'push' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
